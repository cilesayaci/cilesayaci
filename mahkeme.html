<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Çile Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;
    font-family:'Montserrat',-apple-system,BlinkMacSystemFont,sans-serif;
    color:#0a0a0a;background:#fff;
    background-image:radial-gradient(circle at 50% 12%,#fff 0%,#fbfbfb 46%,#ededed 100%);
    background-attachment:fixed;
    display:flex;align-items:center;justify-content:center;
    padding:32px 22px;
    -webkit-font-smoothing:antialiased;
  }
  .kapi{width:100%;max-width:380px}
  h1{font-size:clamp(44px,14vw,64px);font-weight:800;letter-spacing:-.045em;line-height:.92;margin:0}
  .alt{font-size:13px;font-weight:500;color:#9b9b9b;margin:14px 0 40px;letter-spacing:-.01em}
  form{display:flex;flex-direction:column;gap:12px}
  .alan{position:relative}
  input[type=password],input[type=text]{
    width:100%;font-family:inherit;font-size:16px;font-weight:600;letter-spacing:-.01em;
    padding:16px 70px 16px 18px;border-radius:14px;border:1px solid #d4d4d4;background:rgba(255,255,255,.8);
    color:#0a0a0a;outline:none;transition:border-color .18s ease;
  }
  input:focus{border-color:#0a0a0a}
  .goster{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    font-family:inherit;font-size:12px;font-weight:600;color:#9b9b9b;
    background:none;border:none;cursor:pointer;padding:8px;
  }
  .goster:hover{color:#0a0a0a}
  button.gir{
    font-family:inherit;font-size:15px;font-weight:700;letter-spacing:-.02em;
    padding:17px 22px;border:none;border-radius:14px;background:#0a0a0a;color:#fff;
    cursor:pointer;display:flex;justify-content:space-between;align-items:center;
    transition:background-color .2s ease,transform .15s ease;
  }
  button.gir:hover{background:#2e2e2e;transform:translateY(-1px)}
  button.gir:disabled{opacity:.6;cursor:wait;transform:none}
  label.hatirla{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500;color:#4a4a4a;cursor:pointer;margin-top:4px}
  label.hatirla input{width:16px;height:16px;accent-color:#0a0a0a}
  .hata{font-size:13px;font-weight:600;color:#c8102e;min-height:20px;margin-top:6px;letter-spacing:-.01em}
  .sars{animation:sars .45s ease}
  @keyframes sars{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
  .cetele{margin-top:26px;min-height:20px}
  .cetele path{stroke:#0a0a0a;stroke-width:1.7;stroke-linecap:round;fill:none}
  .cetele path.x{stroke:#c8102e}
  noscript{display:block;margin-top:20px;font-size:13px;color:#c8102e}
</style>
</head>
<body>
<main class="kapi" id="kapi" hidden>
  <h1>Çile<br>Paneli</h1>
  <p class="alt">Bu sicil kilitli. Şifreyi bilen girer.</p>
  <form id="form" autocomplete="off">
    <div class="alan">
      <input id="sifre" type="password" placeholder="şifre" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="şifre" required>
      <button type="button" class="goster" id="goster">göster</button>
    </div>
    <button class="gir" id="gir" type="submit">Gir <span>→</span></button>
    <label class="hatirla"><input type="checkbox" id="hatirla" checked> Bu cihazda hatırla</label>
    <div class="hata" id="hata" role="alert"></div>
  </form>
  <div class="cetele" id="cetele" aria-hidden="true"></div>
</main>

  var HAFIZA = "cile_anahtar";
  var SURE = 30 * 24 * 3600 * 1000;

  var hataSozleri = [
    "yanlış. bu da çeteleye yazıldı.",
    "yine mi? engel listesi kadar ısrarcısın.",
    "şifre de seni engelledi.",
    "palmiye bile biliyor bu şifreyi. sen bilmiyorsun.",
    "tck 125'e girmeden bırak istersen."
  ];

  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function b64e(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }

  function ac(keyRaw) {
    return crypto.subtle.importKey("raw", keyRaw, "AES-GCM", false, ["decrypt"])
      .then(function (k) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(YUK.iv) }, k, b64(YUK.data));
      })
      .then(function (d) { return new TextDecoder().decode(d); });
  }

  function turet(sifre) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(sifre), "PBKDF2", false, ["deriveBits"])
      .then(function (base) {
        return crypto.subtle.deriveBits(
          { name: "PBKDF2", salt: b64(YUK.salt), iterations: YUK.iter, hash: "SHA-256" }, base, 256);
      });
  }

  function oturumaKoy(keyRaw) {
    try { sessionStorage.setItem("cile_oturum", JSON.stringify({ salt: YUK.salt, k: b64e(keyRaw) })); } catch (e) {}
  }
  function yaz(html) {
    document.open(); document.write(html); document.close();
  }

  function kayitli() {
    try {
      var r = JSON.parse(localStorage.getItem(HAFIZA) || "null");
      if (!r || r.salt !== YUK.salt || Date.now() > r.bitis) return null;
      return b64(r.k);
    } catch (e) { return null; }
  }
  function kaydet(keyRaw) {
    try { localStorage.setItem(HAFIZA, JSON.stringify({ salt: YUK.salt, k: b64e(keyRaw), bitis: Date.now() + SURE })); } catch (e) {}
  }
  function unut() { try { localStorage.removeItem(HAFIZA); } catch (e) {} }

  var kapi = document.getElementById("kapi");
  function kapiyiGoster() { kapi.hidden = false; document.getElementById("sifre").focus(); }

  // önce hatırlanan anahtarı dene
  var k = kayitli();
  if (k) {
    ac(k).then(function (h) { oturumaKoy(k); yaz(h); }).catch(function () { unut(); kapiyiGoster(); });
  } else {
    kapiyiGoster();
  }

  // --- form ---
  var yanlis = 0;
  var input = document.getElementById("sifre");
  var gir = document.getElementById("gir");
  var hata = document.getElementById("hata");

  document.getElementById("goster").addEventListener("click", function () {
    var g = input.type === "password";
    input.type = g ? "text" : "password";
    this.textContent = g ? "gizle" : "göster";
    input.focus();
  });

  function cetele(n) {
    var g = Math.ceil(n / 5), out = "";
    for (var i = 0; i < g; i++) {
      var x0 = i * 30 + 3, bu = Math.min(5, n - i * 5);
      for (var j = 0; j < Math.min(bu, 4); j++) {
        var x = x0 + j * 5;
        out += '<path d="M' + x + ' 2 L' + (x + (j % 2 ? 1 : -1)) + ' 18"/>';
      }
      if (bu === 5) out += '<path class="x" d="M' + (x0 - 3) + ' 15 L' + (x0 + 20) + ' 4"/>';
    }
    return '<svg width="' + (g * 30) + '" height="20">' + out + '</svg>';
  }

  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var s = input.value;
    if (!s) return;
    gir.disabled = true; hata.textContent = "";
    var keyRaw;
    turet(s)
      .then(function (raw) { keyRaw = raw; return ac(raw); })
      .then(function (html) {
        oturumaKoy(keyRaw);
        if (document.getElementById("hatirla").checked) kaydet(keyRaw); else unut();
        yaz(html);
      })
      .catch(function () {
        yanlis++;
        gir.disabled = false;
        hata.textContent = hataSozleri[(yanlis - 1) % hataSozleri.length];
        kapi.classList.remove("sars"); void kapi.offsetWidth; kapi.classList.add("sars");
        document.getElementById("cetele").innerHTML = cetele(yanlis);
        input.select();
        try { navigator.vibrate && navigator.vibrate([30, 40, 30]); } catch (e) {}
      });
  });
})();
